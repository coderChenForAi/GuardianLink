name: Build iOS

on:
  push:
    paths:
      - 'GuardianLinkIOS/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: GuardianLinkIOS
        run: xcodegen generate

      - name: Show simulators
        run: xcrun simctl list devices available | head -30

      - name: Run unit tests (simulator)
        working-directory: GuardianLinkIOS
        run: |
          set -o pipefail
          xcodebuild test \
            -project GuardianLink.xcodeproj \
            -scheme GuardianLink \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios-test.log

      - name: Build app (simulator)
        working-directory: GuardianLinkIOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project GuardianLink.xcodeproj \
            -scheme GuardianLink \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            GuardianLinkIOS/ios-test.log
            GuardianLinkIOS/ios-build.log
          if-no-files-found: ignore
